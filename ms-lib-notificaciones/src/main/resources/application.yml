spring:
  application:
    name: ms-lib-notificaciones
  config:
    import: optional:configserver:http://config-server:8888
  datasource:
    url: "jdbc:mysql://mysql-biblioteca:3306/db_notificaciones?createDatabaseIfNotExist=true&serverTimezone=UTC"
    username: root
    password: mysql123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 8086
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info


